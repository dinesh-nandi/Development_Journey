<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Function</title>
</head>
<body>
  <h1>Function</h1>
  <script>

    function greet(){
      console.log("Hello jiii !!!");
    }

    greet();

    function college(){
      return "IIT";
    }

    let result = college();
    console.log(result);


    let x = function(){
      console.log("This is known as function expression.")
    }

    x();

  </script>
</body>
</html>
