<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Updating Values</title>
</head>
<body>
  <h1>Updating Values</h1>

  <script>
    let a = 10;
    let b = 20;

    b = b + 4;
    let c = b + b;
    c += 100;
    console.log(c);

    let money = 10;
    money += 5;  //15
    money -= 5;  //10
    money *= 5;  //50
    money /= 5;  //10
    money %= 5;  //0
    money ++;    //1
    money --;    //0

    console.log(money)

  </script>
</body>
</html>
