<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>De-Structuring</title>
</head>
<body>
  <h1>De Structuring</h1>
  <script>
    
    let product = {
      company : 'Mango',
      itemName : 'Cotton striped t-shirt',
      price : 861,
    }

    let {company,price} = product;
    console.log(company);
    console.log(price);
    

  </script>
</body>
</html>
