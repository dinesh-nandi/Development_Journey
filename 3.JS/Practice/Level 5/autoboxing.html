<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Autoboxing</title>
</head>
<body>
  <h1>Autoboxing</h1>
  <script>

    console.log('Namaste JavaScript'.length);
    console.log('Sipderman'.toUpperCase());
    console.log('Welcome to Coding World'.replace('Coding','Programming'));
    console.log('     Hello JS       '.trim());
    console.log('JavaScript'.slice(4,10));
    console.log('Programming'.slice(-3,-1));

    //null and undefined does not support autoboxing 
    let value;
    console.log(value.toString());

  </script>
</body>
</html>
