<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Map</title>
</head>
<body>
  <h1>Map</h1>
  <script>

    let arr = [1,2,3,4,5];
    let squares = arr.map( num => num*num);
    console.log(squares);

    let prices = [100,200,300,400,500];
    let discountedPrice = prices.map( price => price*0.9);
    console.log(prices);
    console.log(discountedPrice);
    
  </script>
</body>
</html>
