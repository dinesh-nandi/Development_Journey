<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Arrow Function</title>
</head>
<body>
  <h1>Arrow Function</h1>
  <script>
    
    let sum = (num1,num2) => {
      return num1+num2;
    }
    console.log(sum(10,20));

    let mul = (a,b) => a*b;
    console.log(mul(2,3));

    let sq = c => c*c;
    console.log(sq(4));
    
  </script>
</body>
</html>
