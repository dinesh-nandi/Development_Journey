<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>For Each</title>
</head>
<body>
  <h1>For Each</h1>
  <script>
    
    //for each loop
    let foods = ['bread', 'rice', 'meat', 'pizza'];
    foods.forEach(function(food){
      console.log(food);
    })
    console.log('another way :');
    foods.forEach(food =>{
      console.log(food);
    })

    //drawbacks of the for each loop is 
    let num = [1,2,3,4,5,6,7,8,9];
    num.forEach(function(nums){
      if(nums === 4){
        return;   //here return behaves like continue
      }
      console.log(nums);
    })


  </script>
</body>
</html>
