<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Default Operator</title>
</head>
<body>
  <h1>Default Operator</h1>
  <script>
    let marks= 0;
    let finalMarks = marks ?? 30;

    console.log(marks);
    console.log(finalMarks);

    let age;
    let finalAge = age ?? 12;

    console.log(age);
    console.log(finalAge);
  </script>
</body>
</html>
