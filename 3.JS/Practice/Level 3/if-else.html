<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>If Else</title>
</head>
<body>
  <h1>If Else</h1>  
  <script>
    let age = 70;

  if (age > 65) {
    console.log("Preferred not to drive");
  } else if (age >= 18) {
    console.log("You can drive");
  } else {
    console.log("Drive Bicycle");
  }
  </script>
</body>
</html>
