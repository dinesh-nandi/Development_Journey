<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Comparison operator</title>
</head>
<body>
  <h1>Comparison Operator</h1>
  <script>
    console.log(2 > 10);
    console.log(3 < 20);

    console.log(100 >= 100);
    console.log(200 <= -10);

    console.log(10 == 100);
    console.log(2 == '2');  //this converts explicitly

    console.log(10 === 100);
    console.log(2 === '2');
    
    console.log(5!=5);
    console.log(5!=='5.0');

    console.log(5+5 == 4+6);
    
  </script>
</body>
</html>
