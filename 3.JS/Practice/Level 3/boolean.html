<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Booleans</title>
</head>
<body>
  <h1>Boolean</h1>
  <script>
    let isStudent = true;
    let isMarried = false;
    console.log(isStudent);
    console.log(isMarried);

    console.log(typeof true);
    console.log(typeof(isStudent));
  </script>
</body>
</html>
