<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Continue</title>
</head>
<body>
  <h1>Continue</h1>
  <script>
    
    for(let i =1; i<10; i++){
      if(i%2 == 0){
        continue;
      }
      console.log(i);
    }
    
  </script>
</body>
</html>
