<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title></title>
</head>
<body>
  <h1>Do while</h1>
  <script>

    let n = 0;
    do{
      console.log("Hello");
      n++;
    }while(n < 3);

  </script>
</body>
</html>
