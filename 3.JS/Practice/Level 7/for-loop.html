<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>For Loop</title>
</head>
<body>
  <h1>For Loop</h1>
  <script>

    let nums = [1, 21.3, 341, 43, 34];
    
    for(let i = 0; i < nums.length; i++){
      console.log(nums[i]);
    }
    
  </script>
</body>
</html>
