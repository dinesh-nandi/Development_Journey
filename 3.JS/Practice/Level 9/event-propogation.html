<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Event Propagation</title>
</head>
<style>
*{
  margin: 0px;
  padding: 0px;
  box-sizing: border-box;
}

.childDiv{
  width: 100px;
  height: 100px;
  border: 2px solid black;
  background-color: aqua;
  margin: 10px;
  text-align: center;
}

#mainDiv{
  background-color: hotpink;
}
</style>
<body>
  <h1>Event Propogation</h1>

  <div id="mainDiv">
    <div class="childDiv" id="div1">Child Div 1</div>
    <div class="childDiv" id="div2">Child Div 2</div>
    <div class="childDiv" id="div3">Child Div 3</div>
    <div class="childDiv" id="div4">Child Div 4</div>
  </div>

  <script>
    const mainDiv = document.getElementById("mainDiv");
    const box = document.getElementById("div4");

    mainDiv.addEventListener("click", () => {
      console.log("I am Main Div");
    },true);

    box.addEventListener("click", () => {
      console.log("I am div boxes");
    });

    document.body.addEventListener('click' , () => {
      console.log("body");
    },true);
  </script>
</body>
</html>
