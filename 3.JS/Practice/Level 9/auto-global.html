<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Auto Global</title>
</head>
<body>
  <h1>Auto Global</h1>
  <script>

    var naam = "Dinesh";
    function func1(){
      // "use strict"
      console.log(naam);
      hello = "Unicorn";
    }

    func1();
    console.log(hello);
    console.log(naam);
  </script>
</body>
</html>
