<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cricket Game</title>
  <link rel="stylesheet" href="cricket-game.css">
</head>
<body>
  <div class="container">
    <h1 class="text">Bat Ball Stump Game</h1>

    <div class="game">

    <button 
      onclick="
      
      let computerChoice = choice();
      let userChoice = 'Bat';
      let result = comparing(userChoice,computerChoice);
      alertMsg(userChoice , computerChoice , result);

      ";
      class="bat">
      <img src="../Images/cricket-game/bat.png" alt="Bat" class="choice-img">
    </button>

    <button
      onclick="

      computerChoice = choice();
      userChoice = 'Ball';
      result = comparing(userChoice,computerChoice);
      alertMsg(userChoice , computerChoice , result);

      ";
      class="ball">
      <img src="../Images/cricket-game/ball.png" alt="Ball" class="choice-img">
    </button>

    <button 
      onclick="

      computerChoice = choice();
      userChoice = 'Stump';
      result = comparing(userChoice,computerChoice);
      alertMsg(userChoice , computerChoice , result);

      ";
      class="stump">
      <img src="../Images/cricket-game/stump.png" alt="Stump" class="choice-img">
    </button>

  </div>

  <div class="gameplay">
    <h1 id="user-move"></h1>
    <h1 id="computer-move"></h1>
    <h1 id="result"></h1>
    <h1 id="score"></h1>


    <div onclick="deleted();"
    class="reset">Reset</div>
    </div>
    
  </div>
  <script>
    
    let scoreStr = localStorage.getItem('Score');
    let score = JSON.parse(localStorage.getItem('Score')) ?? {
      win: 0,
      loss: 0,
      tie: 0,
    };
      
    score.displayScore = function(){
      return  `     
              Won  : ${this.win}
              Loss  : ${this.loss}
              Tie   : ${this.tie}`;
    };

    function choice(){
      
      let randomChoice =  Math.random()*3;

      if(randomChoice > 0 && randomChoice <=1){
        return 'Bat';
      }else if(randomChoice > 1 && randomChoice <= 2){
        return 'Ball';
      }else{
        return 'Stump';
      }

    }

    function comparing(userChoice , computerChoice){

      if(userChoice === computerChoice){
        score.tie++;
        return `it's a tie`;
      }else if( (userChoice === 'Bat' && computerChoice === 'Ball') || (userChoice === 'Ball' && computerChoice === 'Stump') || (userChoice === 'Stump' && computerChoice === 'Bat') ){
        score.win++;
        return `User won`;
      }else{
        score.loss++;
        return `Computer won`;
      }
    }

    function alertMsg(userChoice , computerChoice , result){

      localStorage.setItem('Score' , JSON.stringify(score));

      document.querySelector('#user-move').innerText = userChoice !== undefined ? `You have choose to ${userChoice}.` : ' ';

      document.querySelector('#computer-move').innerText = computerChoice !== undefined ? `Computer choose to ${computerChoice}.` : ' ';

      document.querySelector('#result').innerText = result !== undefined ? `${result}.` : ' ';

      document.querySelector('#score').innerText = score.displayScore();

    }

    function deleted(){
      localStorage.clear();

      score = {
        win: 0,
        loss: 0,
        tie: 0,
      }

      score.displayScore = function () {
          return `
                  Won : ${this.win}
                  Loss : ${this.loss}
                  Tie : ${this.tie}`;
      };

      alertMsg();
    };



  </script>
</body>
</html>
