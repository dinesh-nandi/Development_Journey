<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cricket Game</title>
  <link rel="stylesheet" href="cricket-game.css">
</head>
<body>
  <div class="container">
    <h1 class="text">Bat Ball Stump Game</h1>

    <div class="game">

    <button 
      onclick="
      
      let computerChoice = choice();
      let userChoice = 'Bat';
      let result = comparing(userChoice,computerChoice);
      alertMsg(userChoice , computerChoice , result);

      ";
      class="bat">Bat 
    </button>

    <button
      onclick="

      computerChoice = choice();
      userChoice = 'Ball';
      result = comparing(userChoice,computerChoice);
      alertMsg(userChoice , computerChoice , result);

      ";
      class="ball">Ball
    </button>

    <button 
      onclick="

      computerChoice = choice();
      userChoice = 'Stump';
      result = comparing(userChoice,computerChoice);
      alertMsg(userChoice , computerChoice , result);

      ";
      class="stump">Stump
    </button>

    <div onclick="deleted();"
    class="reset">Reset</div>
    </div>

  </div>
  <script>
    
    let scoreStr = localStorage.getItem('Score');
    let score = JSON.parse(localStorage.getItem('Score')) ?? {
      win: 0,
      loss: 0,
      tie: 0,
    };
      
    score.displayScore = function(){
      return  `     
              Won  : ${this.win}
              Loss  : ${this.loss}
              Tie   : ${this.tie}`;
    };

    function choice(){
      
      let randomChoice =  Math.random()*3;

      if(randomChoice > 0 && randomChoice <=1){
        return 'Bat';
      }else if(randomChoice > 1 && randomChoice <= 2){
        return 'Ball';
      }else{
        return 'Stump';
      }

    }

    function comparing(userChoice , computerChoice){

      if(userChoice === computerChoice){
        score.tie++;
        return `it's a tie`;
      }else if( (userChoice === 'Bat' && computerChoice === 'Ball') || (userChoice === 'Ball' && computerChoice === 'Stump') || (userChoice === 'Stump' && computerChoice === 'Bat') ){
        score.win++;
        return `User won`;
      }else{
        score.loss++;
        return `Computer won`;
      }
    }

    function alertMsg(userChoice , computerChoice , result){
      localStorage.setItem('Score' , JSON.stringify(score));
      alert(`You have choose to ${userChoice}. Computer choose to ${computerChoice} and ${result} 
      ${score.displayScore()}
      `);
    }

    function deleted(){
      localStorage.clear();

      score = {
        win: 0,
        loss: 0,
        tie: 0,
      }

      score.displayScore = function () {
          return `
                  Won : ${this.win}
                  Loss : ${this.loss}
                  Tie : ${this.tie}`;
  };
    }



  </script>
</body>
</html>
