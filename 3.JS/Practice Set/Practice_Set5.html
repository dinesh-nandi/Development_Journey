<body>
  <h1>Practice Set 5</h1>
  <script>

    let product1 = {
      company : 'Myntra',
      itemName : 'Shirt',
      price : 999,
      'delivery-time' : 'Monday',
    };

    let product2 = {
      company : 'Myntra',
      itemName : 'Shirt',
      price : 999,
      'delivery-time' : 'Monday',
    };
    
    console.log(product1);
    let copyProduct = product1;
    product1.itemName = 'Jeans';
    console.log(product1 , copyProduct);

    console.log(product1['delivery-time']);

    let obj = {
      message : 'good job',
      status : 'completed',
    };

    let {message , status} = obj;
    console.log(message);
    console.log(status);

    function isIdenticalProduct(product1 , product2){

      if(typeof product1 !== 'object' || typeof product2 !== 'object'){
        console.warn('Parameter is not an object.');
        return false;
      }

      if(product1 == product2){
        return true;
      }

      if(product1.company == product2.company && product1.itemName == product2.itemName && product1.price == product2.price){
        return true;
      }else{
        return false;
      }
    }

    console.log(isIdenticalProduct(product1 , product2)); //false beacuse changed the code to jeans
    console.log(isIdenticalProduct(product1 , ''));


  </script>
