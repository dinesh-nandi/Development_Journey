  <h1>Practice Set 7</h1>
  <script>
     
    let numbers = [5,6];
    console.log(numbers);
    numbers.unshift(4);
    console.log(numbers);
    numbers.push(7);
    console.log(numbers);

    function givePosition(num , i){
      return num[i-1];
    }
    let num = [10,20,30,40,50,60];
    console.log(givePosition(num , 4));

    let arr = ["Apple" , "Banana" , "Grapes" , "Mango" , 3 , 23 , 212];
    let arrCopy = arr.splice(0,arr.length);
    console.log(arrCopy);

    let n = 2;
    let count  = 0;
    while(true){
      if(count === 5){
        break;
      }

      let prime = true;
      for(let i=2; i<n; i++){
        if(n%i===0){
          prime = false;
          break;
        }
      }

      if(prime){
        console.log(n)
        count++;
      }

      n++;
    }

    for(let i = 10; i >= 1; i--){
      console.log(`Reverse counting : ${i}`);
    }

    let positiveArr = [1,-6,5,7,-98];
    console.log(`Positive Numbers : `)
    for(let i = 0; i < positiveArr.length; i++){
      if(positiveArr[i] < 0){
        continue;
      }
      console.log(positiveArr[i]);      
    }

    let str = ['KG','Coding','Javascript','Course','is','Best'];
    let accStr = '';
