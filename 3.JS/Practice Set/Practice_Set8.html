<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Practice Set 8</title>
</head>
<body>
  <h1>Practice Set 8</h1>
  <button id="my-btn">Click Me</button>
  <script>

    let mul = (num1 , num2) => num1*num2;
    console.log(mul(3,9)); 

    function runTwice(func) {
      func();
      func();
    }
    function greet() {
      console.log("Hello");
    }
    runTwice(greet);

    let button = document.querySelector("#my-btn");
    let behaviour = event => {
      setTimeout(() => {
        button.style.width = "150px";
      },2000)
    };
    button.addEventListener('click' , behaviour);

    let arr = [10,20,30,40,50,60,70];
    let total = 0;
    arr.forEach(arrs => total += arrs);
    console.log(total);

    let num = [1,2,3,4,5,6,7,8];
    let squares = num.map( value => value*value);
    console.log(squares);
    
  </script>
</body>
</html>
