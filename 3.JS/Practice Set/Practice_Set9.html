<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Practice Set 9</title>
  <style>

    *{
      margin: 0px;
      padding: 0px;
      box-sizing: border-box;
    }

    #container{
      display: flex;
      justify-content: space-evenly;
      margin: 30px;
    }
    
    .left-Div , .right-Div{
      display: flex;
      justify-content: space-evenly;
      align-items: center;
      flex-wrap: wrap;
      height: 300px;
      width: 300px;
      border: 2px solid black;
      background-color: bisque;
      margin: 10px;
    }
    
    .box{
      height: 100px;
      width: 100px;
      border: 1px solid black;
      background-color: hotpink;
      text-align: center;
      padding: 20px;
      cursor: pointer;
    }


  </style>
</head>
<body>
  <h1>Practice Set 9</h1>

  <div id="container">

      <div class="left-Div">
        <div id="box1" class="box" draggable="true">Box 1</div>
        <div id="box2" class="box" draggable="true">Box 2</div>
        <div id="box3" class="box" draggable="true">Box 3</div>
        <div id="box4" class="box"draggable="true">Box 4</div>
      </div>

      <div class="right-Div">

      </div>

  </div>

  <script>
 const boxes = document.querySelectorAll(".box");
const target = document.querySelector(".right-Div");

let draggedBox = null;


    boxes.forEach(box => {
        box.addEventListener("dragstart", () => {
        draggedBox = box;
      });
    });

    target.addEventListener("dragover", (event) => {
      event.preventDefault();
    });

    target.addEventListener("drop", () => {
      target.appendChild(draggedBox);
    });

  </script>
</body>
</html>
