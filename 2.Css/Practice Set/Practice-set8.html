<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Practice Set 8</title>
        <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        #text{
            text-align: center;
        }
        #container{
            height: 550px;
            width: 520px;
            border: 2px solid black;
            background-color: beige;
            display: grid;
            gap: 10px;
            grid-template-columns: repeat(3,minmax(50px,1fr));
            grid-template-rows: repeat(3,1fr);
            grid-template-areas:
                "Header Header Header"
                "Menu Main Right"
                "Menu Footer Footer";
        }
        .box{
            border: 2px solid black;
            padding: 2px;
        }
        .box1{
            background-color: rgb(255, 147, 107);
            grid-area: Header;
        }
        .box2{
            background-color: rgb(85, 251, 251);
            grid-area: Menu;
        }
        .box3{
            background-color: lightgreen;
            grid-area: Main;
        }
        .box4{
            background-color: rgb(242, 147, 194);
            grid-area: Right;
        }
        .box5{
            background-color: rgb(255, 255, 128);
            grid-area: Footer;
        }
    </style>
</head>
<body>
    <h3 id="text">Practice Set 8</h3>
    <div id="container">
        <div class="box1 box">Header</div>
        <div class="box2 box">Menu</div>
        <div class="box3 box">Main</div>
        <div class="box4 box">Right</div>
        <div class="box5 box">Footer</div>
    </div>
</body>
</html>
