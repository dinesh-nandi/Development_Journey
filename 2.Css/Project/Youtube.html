<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Youtube Premium</title>
  <link rel="stylesheet" href="Youtube.css">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Titillium+Web:ital,wght@0,200;0,300;0,400;0,600;0,700;0,900;1,200;1,300;1,400;1,600;1,700&display=swap" rel="stylesheet">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">

</head>
<body>
  <div class="container">

    <header>
      <nav>
        <div class="navigation">
  
          <div class="nav-left">
            <img src="../images/bars.svg" alt="Bars">
            <img class="yt" src="../images/yt logo.svg" alt="Youtube Logo">
          </div>
  
          <div class="nav-center">
            <input type="text" placeholder="Search" name="text">
            <img src="../images/search.svg" alt="Search">
            <img class="mic-logo" src="../images/mic.svg" alt="mic">
          </div>
  
          <div class="nav-right">
            <img src="../images/vidUpload.svg" alt="video">
            <img src="../images/bellicon.svg" alt="Bell">
            <img id="profile" src="https://randomuser.me/api/portraits/men/44.jpg" alt="Profile">
          </div>

        </div>  
      </nav>
    </header>

    <main>
      <section>
        <div class="hero-section">
  
          <div class="yt-premium">
            <img src="../images/yt premium.png" alt="Youtube Premium">
            <h2 class="yt-desc">YouTube and YouTube Music ad-free, offline, and in the background</h2>
          </div>

          <div class="subscription-plan">
            <button class="premium-btn">Get YouTube Premium</button>
            <p class="subscription-text">Prepaid and subscription plans available. Prices start at <br> ₹129.00/month. Free trials available with subscription plans only.</p>
          </div>

          <div class="membership">
            <p>Or save money with an <span class="para">annual, family or student membership</span></p>
            <p class="para">Restrictions apply. Learn more here.</p>
          </div>
  
        </div>
      </section>

    </main>

    <footer>
    </footer>

  </div>
</body>
</html>
