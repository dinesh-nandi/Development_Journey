<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid Template Area</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        #text{
            text-align: center;
        }
        #container{
            height: 550px;
            width: 520px;
            border: 2px solid black;
            background-color: beige;
            display: grid;
            gap: 10px;
            grid-template-columns: repeat(2,1fr);
            grid-template-rows: repeat(3,1fr);
            grid-template-areas:
                "Header Header"
                "Sidebar Content-1"
                "Sidebar Content-2";
        }
        .box{
            border: 2px solid black;
            padding: 2px;
        }
        .box1{
            background-color: rgb(255, 147, 107);
            grid-area: Header;
        }
        .box2{
            background-color: rgb(85, 251, 251);
            grid-area: Sidebar;
        }
        .box3{
            background-color: lightgreen;
            grid-area: Content-1;
        }
        .box4{
            background-color: rgb(242, 147, 194);
            grid-area: Content-2;
        }
    </style>
</head>
<body>
    <h3 id="text">Grid Template Area</h3>
    <div id="container">
        <div class="box1 box">Header</div>
        <div class="box2 box">Sidebar</div>
        <div class="box3 box">Content-1</div>
        <div class="box4 box">Content-2</div>
    </div>
</body>
</html>
