<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Combination Media Query</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        .box{
            height: 100px;
            width: 100px;
            border: 2px solid black;
            margin: 5px;
            padding: 5px;
            background-color: rgb(233, 119, 176);
            text-align: center;
        }
        @media screen and (min-width: 250px) and (max-width: 300px){
            .box{
                border-radius: 50%;
                background-color: beige;
            }
        }
    </style>
</head>
<body>
     <div class="box">Box</div>
</body>
</html>
