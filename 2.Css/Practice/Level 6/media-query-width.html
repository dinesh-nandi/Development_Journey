<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Width</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        .box{
            height: 100px;
            width: 100px;
            border: 2px solid black;
            margin: 5px;
            padding: 5px;
            background-color: hotpink;
        }
        @media screen and (width: 250.4px){
            .box{
                background-color: red;
                width: 50px;
                height: 30px;
            }
        }
    </style>
</head>
<body>
    <div class="box">Box</div>
</body>
</html>
