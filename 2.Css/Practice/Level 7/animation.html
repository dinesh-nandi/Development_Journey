<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animation</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        .box{
            height: 100px;
            width: 100px;
            border: 2px solid black;
            margin: 10px;
            padding: 10px;
            position: relative;
        }
        #box1{
            background-color: blanchedalmond;
            animation-name: straight;
            animation-duration: 3s;
            animation-timing-function: ease-in-out;
            animation-delay: 0s;
            animation-iteration-count: infinite;
            animation-direction: alternate-reverse;
        }
        @keyframes straight{
            from{
                left:10px;
            }
            to{
                left: 400px;
            }
        }
        #box2{
            background-color: cadetblue;
            animation-name: round;
            animation-duration: 4s;
            animation-timing-function: linear;
            animation-delay: 0.5s;
            animation-iteration-count: infinite;
            animation-direction: alternate;
        }
        @keyframes round{
            0%{
                border-radius: 0px;
                left: 0px;
            }
            20%{
                left: 150px;
                border-radius: 20px;
            }
            40%{
                left: 300px;
                border-radius: 40px;
            }
            60%{
                border-radius: 60px;
                left: 450px;
            }
            80%{
                left: 600px;
                border-radius: 80px;
            }
            100%{
                border-radius: 100px;
                left: 700px;
            }
        }
    </style>
</head>
<body>
    <div class="box" id="box1">Animation1</div>
    <div class="box" id="box2">Animation2</div>
</body>
</html>
