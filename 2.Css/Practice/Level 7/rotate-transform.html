<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rotate</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body{
            perspective: 1000px;
        }
        .box{
            height: 100px;
            width: 100px;
            border: 2px solid black;
            margin: 5px;
            padding: 5px;

            transition: all 0.6s ease-in 0s;
        }
        #box1:hover{
            background-color: aquamarine;
            transform: rotate(45deg);
        }
        #box2:hover{
            background-color: beige;
            transform: rotate(180deg);
        }
        #box3:hover{
            background-color: pink;
            transform: 
            rotateX(60deg)
            rotateY(60deg)
            rotateZ(45deg);
        }
        #box4:hover{
            background-color: lightgray;
            transform: rotateY(45deg);
        }
        #box5:hover{
            background-color: aquamarine;
            transform: rotate(270deg);
        }
    </style>
</head>
<body>
    <div class="box" id="box1">45deg</div>
    <div class="box" id="box2">180deg</div>
    <div class="box" id="box3">x y z axis</div>
    <div class="box" id="box4">y 45</div>
    <div class="box" id="box5">270 deg</div>
</body>
</html>
